; Overrides on top of PHP's php.ini-production for the public demo (B15).

; Leave PHP's version out of the response headers.
expose_php = Off

; Errors go to the server log (Render's log view), never into a response.
; The API already turns unexpected errors into a generic 500 (B14a).
display_errors = Off
display_startup_errors = Off
log_errors = On
