# Apache settings for the public demo container (D18, B15).
# They replace the image's default site and its ports.conf.

# Render needs the server on 0.0.0.0, at the port in the PORT variable.
# start.sh makes sure PORT is set before Apache reads this file.
Listen 0.0.0.0:${PORT}

# Stops the "could not reliably determine the server's name" warning.
ServerName localhost

# Say only "Apache" in the Server header and on error pages, not the version.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/api/public

    <Directory /var/www/api/public>
        AllowOverride None
        Require all granted

        # The front controller handles every path, as `php -S public/index.php`
        # does locally. index.php is the only file in public/.
        FallbackResource /index.php

        # Apache keeps the Authorization header away from PHP unless told
        # otherwise, and it carries the access code (F15). Without this line
        # every request would get a 401.
        CGIPassAuth On
    </Directory>

    # The image points these at the container's stderr and stdout, which is
    # what Render's log view shows.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
